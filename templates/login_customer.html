{% extends 'base.html' %} 
{% block main_wrapper %} 
		<div class="main-wrapper">
			
			<div class="breadcrumb-wrapper bg-light-2">
				
				<div class="container" dir="rtl">
				
							<ol class="breadcrumb-list" dir="rtl">
								<li><a href="/">الرئيسية</a></li>
								<li><span style="color:grey;">لوحة التحكم</span></li>
							</ol>
							
				</div>
				
			</div>
			
			<div class="content-wrapper">
			
				<div class="container">
			
					<div class="row" dir="rtl">

						<div style="max-width:500px;margin-right:auto;margin-left:auto" role="main">
	
							<div class="section-title text-right">
								
								<h3>تسجيل الدخول</h3>
								
							</div>
							{% if messages %} 
							{% for message in messages %} 
							<div class="alert alert-danger">
							{{message}}	
							</div>
							{% endfor %} 
							{% else %} 
							<div class="alert alert-success">
							مرحبا بك ، قم بتسجيل الدخول للوحة التحكم
							</div>
							{% endif %} 
							<div class="payment-container" >
							
				
									<div class="col-md-12">
									
										
										<div class="col-md-12">
											
											<div class="">
											
												<div class="row gap-0">
												
													
												</div>
												<div style="max-width:500px;margin-right:auto;margin-left:auto"  dir="rtl"  >
													<form action="{% url 'customer:login_agency' %}" method="POST">
													{% csrf_token %}  
														<label  class="col-xs-12 " >البريد الالكتروني</label>
														<input  name="username" type="email"  class="form-control" >
														<label   class="col-xs-12" >كلمة المرور</label>
														<input  name="password" type="password"  class="form-control" >
													<div class="col-md-12 mt-30" style="text-align:center;">
															<input type="submit" class="btn btn-primary" value="دخول"> 
													<a class="btn btn-danger" href="{% url 'customer:register_user' %}" >حساب جديد </a>
													</div>
													</form>
												</div>	
												
												
												</div>
											</div>
									
										</div>
										
									</div>
									
									<div class="row mt-20">
											
									</div>
									
								
							</div>
							
						</div>


					</div>
				
				</div>
					
			</div>

		</div>
		<!-- end Main Wrapper -->
{% endblock %}
