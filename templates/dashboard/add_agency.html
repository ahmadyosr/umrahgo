{% extends 'base.html' %} 
{% block main_wrapper %} 

    <div class="container " style="margin-bottom: 20%;padding:5%;">

      <div class="row">
      <div class="col-md-12" dir="rtl"> 
        <h1>لوحة تحكم عمرة جو</h1>
        <p class="lead">قم باضافة وكالة </p>
      	<form action="{% url 'dashboard:add_agency' %}" method="POST" >
      	{% csrf_token %}
		  <div class="form-group">
		    <label >Company Title</label>
		    <input type="text" class="form-control" name="title">
		  </div>
		  <div class="form-group">
		    <label >City</label>
		    <select type="text" class="form-control" name="city">
		    {% for country in countries %} 
		    	<option value={{country.id}}>{{country}}</option>
		    {% endfor %} 
		    </select>
		  </div>
		  <div class="form-group">
		    <label >Phone number</label>
		    <input type="text" class="form-control" name="phone_number">
		  </div>
		  <div class="form-group">
		    <label >email</label>
		    <input type="email" class="form-control" name="email">
		  </div>
		  <div class="form-group">
		    <label >address</label>
		    <input type="text" class="form-control" name="address">
		  </div>
		  <div class="form-group">
		    <label >website</label>
		    <input type="text" class="form-control" name="website">
		  </div>
		  <div class="form-group">
		    <label >facebook page</label>
		    <input type="text" class="form-control" name="facebook_page">
		  </div>
		  <button type="submit" class="btn btn-primary">Submit</button>
		</form>
      </div>
      </div>
    </div><!-- /.container -->
{% endblock %}
